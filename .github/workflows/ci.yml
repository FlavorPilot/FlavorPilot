name: FlavorPilot checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install (lockfile required for reproducible releases)
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --include=optional --no-audit --no-fund
          else
            echo '::warning::Bootstrap only: generate, review and commit package-lock.json before any release.'
            npm install --include=optional --no-audit --no-fund
          fi
      - run: npm run validate
      - run: npm run build
      - name: Record dependency audit (release reviewer must examine findings)
        continue-on-error: true
        run: npm audit --omit=dev
