name: FlavorPilot checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install (lockfile required for reproducible releases)
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --include=optional --no-audit --no-fund
          else
            echo '::warning::Bootstrap only: generate, review and commit package-lock.json before any release.'
            npm install --include=optional --no-audit --no-fund
          fi
      - run: npm run validate
      - run: npm run build
      - name: Record dependency audit (release reviewer must examine findings)
        continue-on-error: true
        run: npm audit --omit=dev
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flavorpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flavorpilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FLAVORPILOT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/flavorpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci --include=optional --no-audit --no-fund
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
